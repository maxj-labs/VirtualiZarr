name: Build distribution
on:
  release:
    types:
      - published
  # push:
  #   branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  PIP_ROOT_USER_ACTION: ignore

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    if: github.repository == 'zarr-developers/VirtualiZarr'
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        name: Install Python
        with:
          python-version: '3.13'
      - name: Install build tools
        # Every version is pinned by hash, so a release is built with tools that
        # were reviewed when ci/release/requirements.txt was last updated, not
        # with whatever PyPI serves on release day.
        run: |
          python -m pip install --require-hashes --no-deps -r ci/release/requirements.txt
          git clean -xdf
          git restore -SW .
      - name: Build tarball and wheels
        # --no-isolation: use the pinned setuptools and setuptools-scm installed
        # above. An isolated build would resolve `[build-system] requires` afresh.
        run: |
          python -m build --no-isolation --sdist --wheel .
      - name: Check built artifacts
        run: |
          python -m twine check --strict dist/*
          pwd
          if [ -f dist/virtualizarr-unknown.tar.gz ]; then
            echo "❌ INVALID VERSION NUMBER"
            exit 1
          else
            echo "✅ Looks good"
          fi
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: releases
          path: dist

  test-built-dist:
    # Installs the wheel together with all of its dependencies and imports it.
    # This job runs third-party code, so it deliberately has no deployment
    # environment and no `id-token` permission: nothing here can publish.
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6.3.0
        name: Install Python
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5.0.0
        with:
          name: releases
          path: dist
      - name: List contents of built dist
        run: |
          ls -ltrh
          ls -ltrh dist
      - name: Verify the built dist/wheel is valid
        run: |
          python -m pip install dist/virtualizarr*.whl
          python -c "import virtualizarr; print(virtualizarr.__version__)"

  publish-to-testpypi:
    # The publishing jobs only download the built artifacts and hand them to the
    # publish action. Keep it that way: do not install or run anything here.
    needs: test-built-dist
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: test-release
      url: https://test.pypi.org/p/virtualizarr
    permissions:
      id-token: write # Trusted publishing to TestPyPI
    steps:
      - uses: actions/download-artifact@v5.0.0
        with:
          name: releases
          path: dist
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # verbose: true

  upload-to-pypi:
    needs: publish-to-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/virtualizarr
    permissions:
      id-token: write # Trusted publishing to PyPI
    steps:
      - uses: actions/download-artifact@v5.0.0
        with:
          name: releases
          path: dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
