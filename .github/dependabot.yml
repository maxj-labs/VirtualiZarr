---
version: 2
updates:
  # Dependabot also regenerates the matching entries in
  # .github/workflows/actions.lock when it bumps an action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # The hash-pinned tools that build a release (see release.yml).
  - package-ecosystem: "pip"
    directory: "/ci/release"
    schedule:
      interval: "weekly"
    groups:
      release-tools:
        patterns:
          - "*"
    cooldown:
      default-days: 7
